<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    
    <!-- import the webpage's stylesheet and javascript -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
 
  </head>  

  <body>
    <div class="wrapper">
        <section class="calculator-screen">
          <p id="screen">0</p>
        </section>
    
        <section class="calculator-buttons">
          <!-- 17 buttons in total -->
          <!-- data-value is used so javascript has values to read/access -->
          <!-- buttons row 1 -->
          <button class="clear-button" data-value="C">C</button>
          <button data-value="backspace">&larr;</button>
          <button class="operator" data-value="divide">&divide;</button>

          <!-- buttons row 2 -->
          <button data-value="7">7</button>
          <button data-value="8">8</button>
          <button data-value="9">9</button>
          <button class="operator" data-value="multiply">&#10799;</button>

          <!-- buttons row 3 -->
          <button data-value="4">4</button>
          <button data-value="5">5</button>
          <button data-value="6">6</button>
          <button class="operator" data-value="subtract">&minus;</button>

          <!-- buttons row 4 -->
          <button data-value="1">1</button>
          <button data-value="2">2</button>
          <button data-value="3">3</button>
          <button class="operator" data-value="add">&plus;</button>

          <!-- buttons row 5 -->
          <button class="zero-button" data-value="0">0</button>
          <button class="operator" data-value="equals">&equals;</button>

        </section>
    </div>
  </body>
</html>
